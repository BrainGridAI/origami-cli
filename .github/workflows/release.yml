name: Release

# Publishing a GitHub release (tag vX.Y.Z matching package.json) publishes to npm with
# provenance. Needs the NPM_TOKEN repository secret.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: pnpm typecheck && pnpm test && pnpm build
      - name: Skip if this version is already on npm
        id: published
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@braingrid/origami-cli@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "@braingrid/origami-cli@${version} is already published; nothing to do."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
